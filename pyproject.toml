[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleo-ai"
version = "0.1.0"
description = "Cleo - Personal AI Assistant with Gemini & MCP"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
    "flask-cors>=3.0.10",
    "google-genai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_server"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
exclude = ["tests/"]

# Google GenAI SDK has incomplete type stubs — suppress known issues
[[tool.mypy.overrides]]
module = "google.genai.*"
ignore_errors = true